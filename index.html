<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>송은비 HR 운영 포트폴리오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
/* layout: 좌측 공고 요건 선택, 우측 사례 카드. 요건을 누르면 연결된 사례만 남는다 */
:root{
  --bg:#f4f6fa; --panel:#ffffff; --ink:#14233b; --muted:#5b6b82; --line:#d9e0ec;
  --navy:#17304f; --accent:#2f6bff; --accent-soft:#e6eeff; --on-navy:#ffffff;
  --f-display:"Noto Serif KR","Nanum Myeongjo",serif; --f-body:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1826; --panel:#172338; --ink:#e8eefb; --muted:#9db0cc; --line:#2a3a56;
    --navy:#0b1422; --accent:#6b9bff; --accent-soft:#1f3258; --on-navy:#ffffff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1826; --panel:#172338; --ink:#e8eefb; --muted:#9db0cc; --line:#2a3a56;
  --navy:#0b1422; --accent:#6b9bff; --accent-soft:#1f3258; --on-navy:#ffffff; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.6;font-size:15px}
.hero{background:var(--navy);color:var(--on-navy);padding:28px 20px 24px}
.wrap{max-width:1080px;margin:0 auto}
.hero h1{font-family:var(--f-display);font-size:28px;margin:0 0 6px;text-wrap:balance;letter-spacing:-.01em}
.hero p{margin:0;max-width:none;color:#c9d6f5;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}
.stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;color:#fff}
.stat span{font-size:12px;color:#c9d6f5}
main{max-width:1080px;margin:0 auto;padding:20px 16px 48px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
aside{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;position:sticky;top:12px}
aside h2{font-size:13px;margin:0 0 6px;color:var(--muted);font-weight:700}
.grp{margin:0 0 12px}
.grp:last-of-type{margin-bottom:6px}
.chips{display:flex;flex-direction:column;gap:6px}
.req{font:inherit;font-size:13px;text-align:center;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;display:flex;justify-content:center;gap:8px;align-items:center}
.req:hover{border-color:var(--accent)}
.req:focus-visible,.reset:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.req[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.req i{font-style:normal;font-size:11px;font-variant-numeric:tabular-nums;opacity:.75}
.reset{font:inherit;font-size:13px;width:100%;background:transparent;border:1px dashed var(--line);color:var(--muted);border-radius:8px;padding:7px;cursor:pointer}
.status{font-size:13px;color:var(--muted);margin:0 0 12px}
.status b{color:var(--ink)}
.cards{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 10px}
.card[hidden]{display:none}
.no{font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1}
.card h3{margin:0;font-size:16px;text-wrap:balance}
.org{font-size:12px;color:var(--muted);margin:2px 0 6px}
.card p{margin:0 0 8px;max-width:68ch}
.res{font-size:13px;background:var(--accent-soft);border-radius:8px;padding:6px 10px;display:inline-block}
.res b{color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.col2{grid-column:2}
footer{max-width:1080px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:12px}
@media (max-width:820px){
  main{grid-template-columns:minmax(0,1fr)}
  aside{position:static}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chips{flex-direction:row;flex-wrap:wrap}
}
@media (prefers-reduced-motion:no-preference){.card{transition:opacity .15s}}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <h1>송은비 HR 운영 포트폴리오</h1>
  <p>HR Operations Junior 공고의 담당업무, 자격요건, 우대사항마다 제가 해 본 일을 연결했습니다.<br>왼쪽에서 요건을 누르면 해당 사례만 보입니다.</p>
</div></header>
<main>
  <aside aria-label="공고 요건">
    <div id="groups"></div>
    <button class="reset" id="reset" type="button">전체 사례 보기</button>
  </aside>
  <section aria-live="polite">
    <p class="status" id="status"></p>
    <div class="cards" id="cards"></div>
  </section>
</main>
<footer>사례 번호와 내용은 함께 제출한 경력기술서와 같습니다.</footer>
<script>
var CASES = [{"no": "01", "title": "급여 데이터 대조로 예수금 통장 차액 분석", "org": "서울대 생활과학대학 행정실", "body": "급여 데이터 약 24개월치(전임자 담당 기간 포함)를 공제액과 실제 납부액 기준으로 비교하는 엑셀을 직접 구축했습니다. 차액 약 400만원 중 과공제 260만원은 원인을 규명해 재직자와 퇴사자 모두에게 환급했습니다. 나머지 140만원은 예수금 통장을 전 단과대학이 함께 쓰는 구조라 단독으로 원인을 규명할 수 없어, 분석 자료와 함께 인수인계했습니다. 관리 기준도 문서화했습니다.", "result": "차액 약 400만원 중 260만원 원인 규명·재직자 및 퇴사자 환급"}, {"no": "02", "title": "법정의무교육 본사 일원화 운영안 제안", "org": "씨티씨바이오 경영기획실", "body": "본사와 4개 사업장이 따로 운영하던 법정의무교육을 현행안과 본사 일괄 운영안으로 나눠 비용·관리 기준으로 비교해 보고했습니다. 인사총무팀에는 업무 부담은 줄이면서 미이수 시 불이익 리스크를 한 곳에서 관리할 수 있다는 점을 중심으로 설득해 일원화하는 안을 제안했습니다.", "result": "승인 후 인사총무팀으로 이관"}, {"no": "03", "title": "신입생 전형 접수부터 최종 등록 안내까지 운영", "org": "서울대 여성학협동과정", "body": "입시설명회를 기획·운영하고 지원 서류 접수·관리와 평가 서류 제출을 맡았습니다. 온라인 제출 후 실물 서류가 도착하지 않은 지원자에게는 먼저 유선으로 확인해 누락을 막았습니다. 내부·외부 심사위원 일정을 조율하고 외부 심사위원을 섭외했으며, 면접 당일 다과는 지원자 성향을 고려해 비건 옵션을 포함했습니다.", "result": "일정 차질 없이 진행, 합격자 전원 등록"}, {"no": "04", "title": "수당 데이터 입력·신고 체계 표준화", "org": "서울대 생활과학대학 행정실", "body": "원천세·4대보험 신고 담당 공백으로 가산세 가능성이 생기자 맡을 사람이 정해지지 않은 업무를 인접 업무 담당자로서 자발적으로 인수했습니다. 입력 양식·체크리스트·일정 관리표를 도입하고 매뉴얼을 구축했습니다.", "result": "한 해 동안 원천세·4대보험 신고를 오류 없이 기한 내 완료"}, {"no": "05", "title": "급여·4대보험·근태 기초자료 운영", "org": "서울대 생활과학대학 행정실", "body": "계약직·무기계약직·단시간근로자 등 고용형태가 다른 구성원의 급여 지급과 급여명세서 발급(SAP)을 맡았습니다. 4대보험 취득·상실 신고를 기한 내 처리하고, 단시간근로자는 출근부를 확인해 시급과 주휴수당을 계산해 지급했습니다. 원천세 신고·납부, 연말정산 자료 준비, 급여·공제 문의 응대도 함께 했습니다.", "result": null}, {"no": "06", "title": "설문·면담으로 신입생 온보딩 세미나 재설계", "org": "서울대 여성학협동과정", "body": "OT에서 관심 주제를 묻고 세미나 직전 설문·면담으로 필요를 확인했습니다. 개념 중심 구성에서 이슈페이퍼·발제문 작성법 같은 실무 스킬 수요를 확인해 재학생도 듣는 오픈 특별세미나로 기획하고, 이슈페이퍼 작성이 많은 석사생을 강사로 모집했습니다. 석사 연구에서 쓴 참여 관찰·심층 면접 방법을 설문·면담에 연결했습니다.", "result": "예상 신입생 4명에서 석사생 포함 열 명 내외 참석"}, {"no": "07", "title": "반복 업무 자동화 (휴가 캘린더·법인카드 전표)", "org": "씨티씨바이오 경영기획실", "body": "하이웍스 휴가 신청서를 부서 캘린더 연차 입력으로 연결했습니다. AI가 매일 점심시간에 결재가 끝난 휴가를 확인해 입력하며 현재 확인 없이 자동 처리됩니다. 법인카드는 AI가 계정과목 분류까지 맡고 본인이 결과를 검토하며, 전표 템플릿은 첫 적용 후 효과를 확인할 예정입니다.", "result": "휴가 입력 자동 처리 중, 전표 템플릿은 진행 중인 업무"}, {"no": "08", "title": "사규 개정 1차 검토: 취업규칙·인사규정 포함", "org": "씨티씨바이오 경영기획실", "body": "내년 시행을 목표로 진행 중인 사규 개정에서 경영기획실 측 1차 검토를 맡았습니다. 취업규칙·인사규정을 포함한 규정 전반에서 규정 간 상충, 비문·오타, 개정 법률 반영 여부를 AI로 먼저 확인한 뒤, 개정이 필요한 부분은 직접 확인해 검토 회의를 준비했습니다.", "result": "진행 중인 업무"}];
/* 요건별로 연결되는 사례 번호 */
var REQS = [
 {g:"담당업무", items:[
  {t:"채용 프로세스 운영", c:["03"]},
  {t:"입·퇴사, 온보딩, 휴가 운영", c:["05","06","07"]},
  {t:"근태·인사정보 관리", c:["05"]},
  {t:"급여·4대보험 기초자료 관리", c:["01","04","05"]},
  {t:"복리후생·구성원 문의 대응", c:["03","05"]}
 ]},
 {g:"자격요건", items:[
  {t:"채용·기본 HR 운영 업무 이해", c:["03","05","06","08"]},
  {t:"Excel·Google Sheets 데이터 관리", c:["01","05"]},
  {t:"일정·우선순위 관리", c:["03","04"]},
  {t:"지원자·구성원과의 명확한 소통", c:["02","03","06"]},
  {t:"능동적 문제 해결", c:["02","04","07"]},
  {t:"급여·인사 정보 취급", c:["01","05"]}
 ]},
 {g:"우대사항", items:[
  {t:"AI·자동화 도구로 효율 개선", c:["07","08"]}
 ]}
];
var active = null;
var $ = function(id){return document.getElementById(id)};
function tagsFor(no){
  var out=[];
  REQS.forEach(function(g){g.items.forEach(function(r){ if(r.c.indexOf(no)>-1) out.push(r.t); });});
  return out;
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]});}
function renderCards(){
  $("cards").innerHTML = CASES.map(function(c){
    var tg = tagsFor(c.no).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join("");
    return '<article class="card" data-no="'+c.no+'">'+
      '<div class="no">'+c.no+'</div>'+
      '<div><h3>'+esc(c.title)+'</h3><div class="org">'+esc(c.org)+'</div></div>'+
      '<div class="col2"><p>'+esc(c.body)+'</p>'+
      (c.result?'<span class="res"><b>결과</b> '+esc(c.result)+'</span>':'')+
      '<div class="tags">'+tg+'</div></div></article>';
  }).join("");
}
function renderGroups(){
  $("groups").innerHTML = REQS.map(function(g,gi){
    return '<div class="grp"><h2>'+g.g+'</h2><div class="chips">'+
      g.items.map(function(r,ri){
        return '<button type="button" class="req" aria-pressed="false" data-g="'+gi+'" data-r="'+ri+'"><span>'+esc(r.t)+'</span></button>';
      }).join("")+'</div></div>';
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll(".req"),function(b){
    b.addEventListener("click",function(){
      var r = REQS[+b.dataset.g].items[+b.dataset.r];
      active = (active===r) ? null : r;
      update();
    });
  });
}
function update(){
  var shown=0;
  Array.prototype.forEach.call(document.querySelectorAll(".card"),function(el){
    var ok = !active || active.c.indexOf(el.dataset.no)>-1;
    el.hidden = !ok; if(ok) shown++;
  });
  Array.prototype.forEach.call(document.querySelectorAll(".req"),function(b){
    b.setAttribute("aria-pressed", String(active===REQS[+b.dataset.g].items[+b.dataset.r]));
  });
  $("status").innerHTML = active
    ? '<b>'+esc(active.t)+'</b>와 연결된 사례 '+shown+'개'
    : '전체 사례 '+CASES.length+'개, 결과가 뚜렷한 순서로 정리했습니다.';
}
$("reset").addEventListener("click",function(){active=null;update();});
renderCards(); renderGroups(); update();
</script>
</body>
</html>
